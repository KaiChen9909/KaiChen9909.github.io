name: Get Citation Data

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-scholar-crawler
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r google_scholar_crawler/requirements.txt --no-input

      - name: Run crawler
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          FAKE_USERAGENT_NO_CACHE: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          cd google_scholar_crawler
          timeout 20m python -u main.py

      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd google_scholar_crawler/results
          shopt -s nullglob
          files=(*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No JSON files to commit. Skipping push."
            exit 0
          fi
          git init
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$PWD"
          git add *.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Updated Citation Data"
          remote_repo="https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git branch -M google-scholar-stats
          git push "${remote_repo}" google-scholar-stats --force



